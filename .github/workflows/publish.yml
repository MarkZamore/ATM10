name: Publish ATM10 pack

on:
  push:
    branches: [main]

concurrency:
  group: atm10-pack-latest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The pack tree (~3 GB) + its shallow .git + dist/assets copy (~3 GB)
      # barely fit the runner's ~14 GB root; drop preinstalled toolchains we
      # never use to make the job comfortable.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The layout is only a promise until something proves it: this reads the
      # preset against the key registry and NeoForge's own KeyMapping.same, and
      # fails the publish if any two mappings would come out red in the
      # Controls screen.
      - name: Check the controls preset
        run: python tools/keybinds/check_preset.py

      - name: Generate manifest and stage assets
        run: python tools/generate_manifest.py --pack . --out dist --revision "$GITHUB_SHA"

      - name: Self-check staged assets
        run: python tools/generate_manifest.py --pack . --out dist --verify-only

      - name: Publish pack-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Recreate the rolling release from scratch. The launcher treats the
          # release as incomplete until pack-manifest.json is present, so it is
          # safe to delete and repopulate here.
          gh release delete pack-latest --yes --cleanup-tag || true
          git push origin :refs/tags/pack-latest || true
          sleep 5

          gh release create pack-latest \
            --target "$GITHUB_SHA" \
            --title "ATM10 pack" \
            --notes "Rolling ATM10 pack release. Revision: $GITHUB_SHA"

          upload_batch() {
            local attempt
            for attempt in 1 2 3; do
              if gh release upload pack-latest "$@" --clobber; then
                return 0
              fi
              echo "Upload batch failed (attempt $attempt/3)" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done
            echo "Upload batch failed after 3 attempts" >&2
            return 1
          }

          batch=()
          for f in dist/assets/*; do
            batch+=("$f")
            if [ "${#batch[@]}" -eq 40 ]; then
              upload_batch "${batch[@]}"
              batch=()
            fi
          done
          if [ "${#batch[@]}" -gt 0 ]; then
            upload_batch "${batch[@]}"
          fi

          # The manifest is uploaded LAST: its presence marks the release as
          # complete and consumable for the launcher.
          upload_batch dist/pack-manifest.json
